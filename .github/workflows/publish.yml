name: Publish queued RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: rss-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish due entries
        run: python3 scripts/publish.py
      - name: Commit feed if changed
        run: |
          if ! git diff --quiet -- feed.xml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add feed.xml
            git commit -m 'Publish due RSS entries'
            git push origin HEAD:main
          fi
      - name: Stage public assets only
        run: |
          mkdir _site
          cp feed.xml _site/
          cp -R pins _site/
          cp -R covers _site/
          cp index.html .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record run outcome
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          echo "## RSS publication: $OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo 'This run processes prepared queue items only. Pinterest ingestion and sales are separate checks.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo '::error::RSS publication failed. Inspect this run before adding or retrying queue items.'
          fi
